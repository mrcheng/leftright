<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10160e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23b5be73'/%3E%3Ctext x='7' y='44' font-family='monospace' font-size='38' font-weight='bold' fill='%2310160e'%3ELR%3C/text%3E%3C/svg%3E">
<meta name="description" content="Follow the orders. Survive the longest. Play Left Right online with friends, right in your browser.">
<title>Left Right</title>
<style>
@font-face{font-family:Drill;src:url(style/PressStart2P.ttf) format('truetype');font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10160e;color:#f4e9ba;font-family:Drill,monospace}
#stage{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#10160e}
canvas{width:100%;height:100%;display:block;outline:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input{font:inherit}button{color:#11190e;background:#b5be73;border:2px solid #747f48;cursor:pointer}button:hover{background:#d0d78f}button:focus-visible,input:focus-visible{outline:2px solid #f4e9ba;outline-offset:2px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:#10160e;z-index:5;text-align:center;padding:24px}
#status{font-size:10px;line-height:2}progress{width:min(380px,70%);height:10px;accent-color:#b5be73}#error{font-size:10px;line-height:2;color:#ffd0a6;white-space:pre-wrap}#play{padding:15px;font-size:12px}
#fullscreen{position:absolute;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:3;font-size:15px;width:30px;height:28px;opacity:.55}#fullscreen[hidden]{display:none}
#touch-controls{display:none;position:absolute;inset:0;pointer-events:none;z-index:2;user-select:none}body.touch-playing #touch-controls{display:block}
.touch-hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));font-size:10px;text-shadow:2px 2px #10160e;opacity:.7}.touch-hint:first-child{left:max(20px,env(safe-area-inset-left))}.touch-hint:nth-child(2){right:max(20px,env(safe-area-inset-right))}
#jump{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);pointer-events:auto;touch-action:none;min-width:95px;min-height:52px;background:#b5be73c9;font-size:10px}
/* Native input/clipboard are placed over their matching in-game lobby controls,
   so phone keyboards work without introducing a second menu around the game. */
#gui-overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.777778dvh);height:min(100dvh,56.25vw);pointer-events:none;z-index:3}
#gui-overlay>*{pointer-events:auto}#join-form{position:absolute;left:32.03125%;top:69.1667%;width:35.9375%;height:7.0833%;display:flex;gap:3.26%;z-index:3}
#join-code{min-width:0;width:61.9565%;background:#10160e;color:#f4e9ba;border:2px solid #717b49;text-align:center;font-size:clamp(9px,1.4vw,18px)}#join-form button{flex:1;font-size:clamp(9px,1.25vw,16px)}
#copy-room{position:absolute;left:58.59375%;top:50%;width:10.15625%;height:5.5556%;z-index:3;font-size:clamp(8px,1vw,14px)}#join-form[hidden],#copy-room[hidden]{display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="game" tabindex="0" aria-label="Left Right multiplayer game"></canvas>
<button id="fullscreen" title="Fullscreen" aria-label="Fullscreen" hidden>⛶</button>
<div id="touch-controls"><span class="touch-hint">◀ HOLD LEFT</span><span class="touch-hint">HOLD RIGHT ▶</span><button id="jump">JUMP</button></div>
<div id="gui-overlay"><form id="join-form" hidden><input id="join-code" aria-label="Friend's room code" placeholder="ROOM CODE" maxlength="12" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"><button>JOIN</button></form>
<button id="copy-room" hidden>COPY</button></div>
<div id="loading"><p id="status">Loading…</p><progress id="progress" max="1" value="0"></progress><p id="error" role="alert" hidden></p><button id="play" hidden>RELOAD</button></div>
</div>
<script>
const canvas=document.getElementById('game'),loading=document.getElementById('loading'),status=document.getElementById('status'),progress=document.getElementById('progress');
const touchDevice=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
const fullscreen=document.getElementById('fullscreen'),joinCode=document.getElementById('join-code');
let instance;
window.leftRightInput={axis:0,jump:false};
const touches=new Map();
function canMove(){const s=window.leftRightLobby;return s&&s.playing&&!s.menu&&!s.over}
function resetInput(){touches.clear();window.leftRightInput.axis=0;window.leftRightInput.jump=false}
function updateAxis(){// Opposite fingers cancel; releasing one keeps the other held.
 window.leftRightInput.axis=Math.sign([...touches.values()].reduce((sum,axis)=>sum+axis,0));
}
window.addEventListener('leftright-lobby',event=>{
 const state=event.detail;window.leftRightLobby={...state,updatedAt:performance.now()};
 document.body.classList.toggle('touch-playing',touchDevice&&canMove());
 if(!canMove())resetInput();
 document.getElementById('join-form').hidden=!touchDevice||!!state.code||!state.menu||state.menuPage!==3;
 document.getElementById('copy-room').hidden=!state.code||!state.host||!state.menu||state.menuPage!==3;
});
// The game always fills the viewport, including iPhone browsers without native
// fullscreen. Native fullscreen is an optional enhancement, not a layout dependency.
fullscreen.hidden=!document.body.requestFullscreen;
fullscreen.onclick=()=>{resetInput();canvas.focus();if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else document.body.requestFullscreen?.().then(()=>screen.orientation?.lock?.('landscape')).catch(()=>{})};
document.addEventListener('fullscreenchange',()=>{const active=!!document.fullscreenElement;fullscreen.textContent=active?'×':'⛶';fullscreen.setAttribute('aria-label',active?'Exit fullscreen':'Fullscreen');resetInput()});
function side(event){const r=canvas.getBoundingClientRect();return event.clientX<r.x+r.width/2?-1:1}
canvas.addEventListener('pointerdown',event=>{
 canvas.focus();if(event.pointerType==='mouse'||!canMove())return;
 const r=canvas.getBoundingClientRect();
 // Keep the in-game settings button available in the top-right corner.
 if(event.clientX>r.right-r.width*.09&&event.clientY<r.y+r.height*.13)return;
 event.preventDefault();canvas.setPointerCapture(event.pointerId);touches.set(event.pointerId,side(event));updateAxis();
});
canvas.addEventListener('pointermove',event=>{if(touches.has(event.pointerId)){touches.set(event.pointerId,side(event));updateAxis()}});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,event=>{touches.delete(event.pointerId);updateAxis()});
document.getElementById('jump').addEventListener('pointerdown',event=>{event.preventDefault();if(canMove())window.leftRightInput.jump=true;canvas.focus()});
window.addEventListener('blur',resetInput);window.addEventListener('resize',resetInput);document.addEventListener('visibilitychange',resetInput);
function browserMessage(method,value){const receiver=window.leftRightLobby?.receiver;if(instance&&receiver)instance.SendMessage(receiver,method,value)}
joinCode.addEventListener('focus',()=>browserMessage('SetBrowserTextFocus','1'));
joinCode.addEventListener('blur',()=>browserMessage('SetBrowserTextFocus','0'));
document.getElementById('join-form').onsubmit=event=>{event.preventDefault();window.leftRightResumeAudio?.();joinCode.blur();browserMessage('JoinBrowserRoom',joinCode.value)};
document.getElementById('copy-room').onclick=async()=>{
 const button=document.getElementById('copy-room');
 try{await navigator.clipboard.writeText(window.leftRightLobby.code);button.textContent='COPIED';setTimeout(()=>button.textContent='COPY',1500)}catch{button.textContent=window.leftRightLobby.code}
};
function fail(message){loading.style.display='flex';status.textContent='Could not start the game.';const error=document.getElementById('error');error.hidden=false;error.textContent=String(message);const reload=document.getElementById('play');reload.hidden=false;reload.onclick=()=>location.reload()}
const script=document.createElement('script');script.src='Build/5162c79b1985ab7e.loader.js';script.onerror=()=>fail('Download failed. Check your connection and reload.');
script.onload=()=>createUnityInstance(canvas,{
 dataUrl:'Build/6a66b3035960da95.data.unityweb',frameworkUrl:'Build/6dc98854f1e8b220.framework.js.unityweb',codeUrl:'Build/b74386ff20da3221.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',
 companyName:'MrCheng',productName:'Left Right',productVersion:'prototype',
 showBanner:(message,type)=>{if(type==='error')fail(message)}
},value=>{progress.value=value;status.textContent='Loading… '+Math.round(value*100)+'%'}).then(game=>{instance=game;loading.style.display='none';canvas.focus()}).catch(fail);
document.body.appendChild(script);
</script>
</body></html>
