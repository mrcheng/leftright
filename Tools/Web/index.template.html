<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10160e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23b5be73'/%3E%3Ctext x='7' y='44' font-family='monospace' font-size='38' font-weight='bold' fill='%2310160e'%3ELR%3C/text%3E%3C/svg%3E">
<meta name="description" content="Follow the orders. Survive the longest. Play Left Right online with friends, right in your browser.">
<title>Left Right</title>
<link rel="stylesheet" href="__RESULTS_STYLE__">
<style>
@font-face{font-family:Drill;src:url(style/PressStart2P.ttf) format('truetype');font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10160e;color:#f4e9ba;font-family:Drill,monospace}
#stage{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#10160e}
#rotate-phone{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#10160e;padding:32px;text-align:center;outline:0}
#rotate-phone[hidden]{display:none}#rotate-phone svg{width:112px;height:112px;color:#b5be73}#rotate-phone h2{font-size:18px;line-height:1.8;margin:0}#rotate-phone p{font-size:11px;line-height:2;max-width:320px;margin:0;color:#c4cba7}
canvas{width:100%;height:100%;display:block;outline:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input{font:inherit}button{color:#11190e;background:#b5be73;border:2px solid #747f48;cursor:pointer}button:hover{background:#d0d78f}button:focus-visible,input:focus-visible{outline:2px solid #f4e9ba;outline-offset:2px}
button,button *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.touch-button *{pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:#10160e;z-index:5;text-align:center;padding:24px}
#status{font-size:10px;line-height:2}progress{width:min(380px,70%);height:10px;accent-color:#b5be73}#error{font-size:10px;line-height:2;color:#ffd0a6;white-space:pre-wrap}#play{padding:15px;font-size:12px}
#touch-controls{display:none;position:absolute;inset:0;pointer-events:none;z-index:2;user-select:none}body.touch-playing #touch-controls{display:block}
.thumb-controls{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}.thumb-controls.left{left:max(18px,env(safe-area-inset-left))}.thumb-controls.right{right:max(18px,env(safe-area-inset-right))}
.touch-button{pointer-events:auto;touch-action:none;-webkit-touch-callout:none;width:56px;height:56px;border-radius:50%;border:1px solid #f4e9ba66;background:#b5be7326;color:#fff9dd;text-shadow:1px 1px 3px #000;font-size:22px;padding:0;display:grid;place-content:center;gap:3px}.touch-button.jump{width:48px;height:48px;font-size:17px}.touch-button small{font-size:7px}.touch-button:hover{background:#b5be7326}.touch-button.held{background:#b5be7366;border-color:#f4e9ba}
/* Native input/clipboard are placed over their matching in-game lobby controls,
   so phone keyboards work without introducing a second menu around the game. */
#gui-overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.777778dvh);height:min(100dvh,56.25vw);pointer-events:none;z-index:3}
#gui-overlay>*{pointer-events:auto}#join-form{position:absolute;left:32.03125%;top:69.1667%;width:35.9375%;height:7.0833%;display:flex;gap:3.26%;z-index:3}
#join-code{min-width:0;width:61.9565%;background:#10160e;color:#f4e9ba;border:2px solid #717b49;text-align:center;font-size:clamp(16px,1.4vw,18px)}#join-form button{flex:1;font-size:clamp(9px,1.25vw,16px)}
#copy-room{position:absolute;left:58.59375%;top:50%;width:10.15625%;height:5.5556%;z-index:3;font-size:clamp(8px,1vw,14px)}#join-form[hidden],#copy-room[hidden]{display:none}
@media(max-aspect-ratio:1/1){
 #gui-overlay{width:min(100vw,55.813953dvh);height:min(100dvh,179.166667vw)}
 #join-form{left:5%;top:50.697674%;width:90%;height:6.511628%;gap:3.703704%}#join-code{width:62.5%}
 #copy-room{left:65.833333%;top:38.372093%;width:29.166667%;height:5.581395%;font-size:12px}
}
</style>
</head>
<body>
<div id="stage"><canvas id="game" tabindex="0" aria-label="Left Right multiplayer game"></canvas>
<div id="touch-controls">
 <div class="thumb-controls left"><button class="touch-button" id="move-left" aria-label="Move left" data-axis="-1">←</button><button class="touch-button jump" id="jump-left" aria-label="Jump on left side">↑<small>JUMP</small></button></div>
 <div class="thumb-controls right"><button class="touch-button jump" id="jump-right" aria-label="Jump on right side">↑<small>JUMP</small></button><button class="touch-button" id="move-right" aria-label="Move right" data-axis="1">→</button></div>
</div>
<div id="gui-overlay"><form id="join-form" hidden><input id="join-code" aria-label="Friend's room code" placeholder="ROOM CODE" maxlength="12" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"><button>JOIN</button></form>
<button id="copy-room" hidden>COPY</button></div>
<section id="round-results" role="dialog" aria-modal="true" aria-labelledby="results-title" hidden>
 <div class="results-card">
  <div class="results-scroll">
   <h2 id="results-title" tabindex="-1">SURVIVAL RESULTS</h2>
   <p class="results-kicker">YOUR TIME</p><p id="result-personal" class="results-time"></p>
   <p id="result-best" class="results-best"></p>
   <div id="result-round" aria-label="Round results"></div>
   <section id="honor-board" aria-labelledby="honor-title" hidden>
    <h3 id="honor-title">HONOR TO OUR GLORIOUS RECRUITS THAT SURVIVED FOR THIS LONG</h3>
    <p class="results-kicker">GLOBAL SURVIVAL · TOP 10</p>
    <form id="score-form" hidden>
     <label for="score-name">TOP 10! ENTER YOUR NAME</label>
     <div class="score-entry"><input id="score-name" maxlength="14" placeholder="YOUR NAME" autocomplete="nickname" autocorrect="off" spellcheck="false" required><button id="score-save" type="submit">SAVE</button></div>
    </form>
    <p id="score-status" role="status" aria-live="polite"></p><button id="score-retry" type="button" hidden>TRY AGAIN</button>
    <table class="score-table"><thead><tr><th scope="col">#</th><th scope="col">RECRUIT</th><th scope="col">TIME</th></tr></thead><tbody id="score-rows"></tbody></table>
   </section>
  </div>
  <div class="results-actions"><button id="result-again" type="button">PLAY AGAIN</button><button id="result-menu" type="button">MAIN MENU</button></div>
 </div>
</section>
<div id="loading"><p id="status">Loading…</p><progress id="progress" max="1" value="0"></progress><p id="error" role="alert" hidden></p><button id="play" hidden>RELOAD</button></div>
<section id="rotate-phone" role="dialog" aria-modal="true" aria-labelledby="rotate-title" tabindex="-1" hidden>
 <svg viewBox="0 0 112 112" fill="none" stroke="currentColor" stroke-width="5" aria-hidden="true"><rect x="20" y="34" width="72" height="44" rx="5"/><path d="M80 48v16M26 20a42 42 0 0 1 65 4M91 10v15H76M86 92a42 42 0 0 1-65-4M21 102V87h15"/></svg>
 <h2 id="rotate-title">TURN YOUR PHONE</h2><p>Play Left Right in landscape.<br>Rotate your phone to continue.</p>
</section>
</div>
<script>
const canvas=document.getElementById('game'),loading=document.getElementById('loading'),status=document.getElementById('status'),progress=document.getElementById('progress');
const touchDevice=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
const joinCode=document.getElementById('join-code');
let instance;
window.leftRightInput={axis:0,jump:false};
const touches=new Map();
const rotatePhone=document.getElementById('rotate-phone'),portraitScreen=matchMedia('(orientation:portrait)');
function updateOrientation(){
 // A browser cannot reliably force device rotation (especially Safari). Gate
 // portrait touch screens instead; desktop windows retain their normal layout.
 const blocked=touchDevice&&portraitScreen.matches;
 const changed=rotatePhone.hidden===blocked;rotatePhone.hidden=!blocked;
 for(const child of document.getElementById('stage').children)if(child!==rotatePhone)child.inert=blocked;
 if(blocked){resetInput();if(changed)rotatePhone.focus()}
 else if(changed)canvas.focus();
}
portraitScreen.addEventListener('change',updateOrientation);
updateOrientation();
function canMove(){const s=window.leftRightLobby;return rotatePhone.hidden&&s&&s.playing&&!s.menu&&!s.over}
function resetInput(){touches.clear();window.leftRightInput.axis=0;window.leftRightInput.jump=false;document.querySelectorAll('.touch-button.held').forEach(button=>button.classList.remove('held'))}
function updateAxis(){// Opposite fingers cancel; releasing one keeps the other held.
 window.leftRightInput.axis=Math.sign([...touches.values()].reduce((sum,axis)=>sum+axis,0));
}
window.addEventListener('leftright-lobby',event=>{
 const state=event.detail;window.leftRightLobby={...state,updatedAt:performance.now()};
 document.body.classList.toggle('touch-playing',touchDevice&&canMove());
 if(!canMove())resetInput();
 document.getElementById('join-form').hidden=!touchDevice||!!state.code||!state.menu||state.menuPage!==3;
 document.getElementById('copy-room').hidden=!state.code||!state.host||!state.menu||![3,5].includes(state.menuPage);
});
// The game fills the browser viewport without an extra fullscreen control.
canvas.addEventListener('pointerdown',()=>canvas.focus());
// Only the four compact buttons capture gameplay touches. The rest of the view
// stays clear, and independent pointer IDs allow either thumb to move and jump.
for(const button of document.querySelectorAll('.touch-button')){
 // Safari's text-selection/callout gesture also needs the legacy touch default
 // cancelled. Keep this scoped to gameplay buttons so room inputs stay editable.
 button.addEventListener('touchstart',event=>event.preventDefault(),{passive:false});
 for(const name of ['contextmenu','selectstart','dragstart'])button.addEventListener(name,event=>event.preventDefault());
 button.addEventListener('pointerdown',event=>{
  if(!canMove())return;event.preventDefault();canvas.focus();button.setPointerCapture(event.pointerId);button.classList.add('held');
  if(button.dataset.axis){touches.set(event.pointerId,Number(button.dataset.axis));updateAxis()}else window.leftRightInput.jump=true;
 });
 for(const name of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(name,event=>{touches.delete(event.pointerId);updateAxis();button.classList.remove('held')});
}
window.addEventListener('blur',resetInput);window.addEventListener('resize',resetInput);document.addEventListener('visibilitychange',resetInput);
function browserMessage(method,value){const receiver=window.leftRightLobby?.receiver;if(instance&&receiver)instance.SendMessage(receiver,method,value)}
joinCode.addEventListener('focus',()=>browserMessage('SetBrowserTextFocus','1'));
joinCode.addEventListener('blur',()=>browserMessage('SetBrowserTextFocus','0'));
document.getElementById('join-form').onsubmit=event=>{event.preventDefault();window.leftRightResumeAudio?.();joinCode.blur();browserMessage('JoinBrowserRoom',joinCode.value)};
document.getElementById('copy-room').onclick=async()=>{
 const button=document.getElementById('copy-room');
 try{await navigator.clipboard.writeText(window.leftRightLobby.code);button.textContent='COPIED';setTimeout(()=>button.textContent='COPY',1500)}catch{button.textContent=window.leftRightLobby.code}
};
function fail(message){loading.style.display='flex';status.textContent='Could not start the game.';const error=document.getElementById('error');error.hidden=false;error.textContent=String(message);const reload=document.getElementById('play');reload.hidden=false;reload.onclick=()=>location.reload()}
const script=document.createElement('script');script.src='__LOADER__';script.onerror=()=>fail('Download failed. Check your connection and reload.');
script.onload=()=>createUnityInstance(canvas,{
 dataUrl:'__DATA__',frameworkUrl:'__FRAMEWORK__',codeUrl:'__WASM__',streamingAssetsUrl:'StreamingAssets',
 companyName:'MrCheng',productName:'Left Right',productVersion:'prototype',
 showBanner:(message,type)=>{if(type==='error')fail(message)}
},value=>{progress.value=value;status.textContent='Loading… '+Math.round(value*100)+'%'}).then(game=>{instance=game;loading.style.display='none';canvas.focus()}).catch(fail);
document.body.appendChild(script);
</script>
<script src="__RESULTS_SCRIPT__"></script>
</body></html>
